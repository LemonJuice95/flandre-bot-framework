# Basic
bot.log_messages=true

# Network
# 0: WS Client; 1: WS Server;
bot.network.mode=0
bot.network.client.url=
bot.network.server.host=0.0.0.0
bot.network.server.port=
bot.network.token=

# Debug
bot.debug_mode=false
bot.debug_users={}

# Experimental
bot.eventbus.bus_mode=sync
bot.command.pooling_runners=false
bot.command.runner_pool.initial_capacity=10
bot.command.runner_pool.maximum_capacity=50
bot.command.runner_pool.miss_rate_threshold=0.3

# *** Danger Zone ***
bot.command_sync_mode=false
bot.eventbus.subscribers.scan_classpath=false